<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{meta.description}}" />
<meta name="keywords" content="{{meta.keywords}}" />
<title>{{title}} | {{meta.title}}</title>

<!-- Google Fonts - Josefin Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet" />

<!-- Preload critical fonts for faster rendering -->
<link rel="preload" href="{{base-path}}fonts/amaticsc-regular.woff2" as="font" type="font/woff2" crossorigin />

<!-- SEO -->
<link rel="canonical" href="https://simplify-living.ch/{{locale}}/" />
<link rel="alternate" hreflang="de" href="https://simplify-living.ch/de/" />
<link rel="alternate" hreflang="en" href="https://simplify-living.ch/en/" />
<link
  rel="alternate"
  hreflang="x-default"
  href="https://simplify-living.ch/de/"
/>

<!-- Open Graph -->
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://simplify-living.ch/{{locale}}/" />

<!-- Styles -->
<link rel="stylesheet" href="{{base-path}}styles/main.css" />

<!-- AOS (Animate On Scroll) Library -->
<link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
